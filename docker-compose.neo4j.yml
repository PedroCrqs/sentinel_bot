services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: sentinel-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
    volumes:
      - sentinel_neo4j_data:/data
      - ./infra/neo4j/constraints.cypher:/var/lib/neo4j/import/constraints.cypher:ro

volumes:
  sentinel_neo4j_data:
